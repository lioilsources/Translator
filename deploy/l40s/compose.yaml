# Celý Translator na L40S. Vlastní projekt: `switch.sh` sandboxu tyto kontejnery
# nezastaví a porty jsou jen na 127.0.0.1. Spuštění: deploy/l40s/up.sh
name: translator
services:
  llm:
    image: vllm/vllm-openai:latest
    container_name: translator-llm
    ipc: host
    restart: unless-stopped
    environment: { HF_HUB_OFFLINE: "1" }
    volumes: ["/srv/hf:/root/.cache/huggingface", "/cold:/cold:ro"]
    command: >-
      --model ${LLM_MODEL:-Qwen/Qwen3-30B-A3B-Instruct-2507-FP8} --served-model-name translator-mt
      --max-model-len 4096 --max-num-seqs 16 --gpu-memory-utilization ${LLM_GPU_SHARE:-0.76}
      --kv-cache-dtype fp8
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }
    healthcheck: { test: ["CMD", "curl", "-sf", "localhost:8000/health"], interval: 10s, start_period: 300s }

  asr:
    build: ../../workers/asr
    container_name: translator-asr
    restart: unless-stopped
    environment:
      ASR_BACKEND: hf
      ASR_MODEL_ROOT: /models/asr
      ASR_MODEL: whisper-large-v3-turbo
      EMBED_ENABLED: "1"
      EMBED_MODEL: /models/speaker/ecapa-voxceleb
      HF_HOME: /tmp/hf
    volumes: ["/srv/work/translator-models:/models:ro"]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  tts:
    image: aistack/audio-tts:latest
    container_name: translator-tts
    restart: unless-stopped
    environment:
      TTS_MODELS_DIR: /models
      TTS_PORT: "8003"
      TTS_CPU_THREADS: "4"
      TTS_PRELOAD: kokoro-82m,piper-cs-kasandra-medium
    volumes: ["/srv/audio/models:/models:ro"]
    mem_limit: 3g

  orchestrator:
    build: ../../server
    container_name: translator
    restart: unless-stopped
    ports: ["127.0.0.1:8096:8096"]
    environment:
      # Tokeny zařízení (docs/protocol.md, „Zařízení“). TRANSLATOR_TOKEN je
      # starý sdílený token z buildů; po přechodu ho smaž.
      TRANSLATOR_TOKEN: ${TRANSLATOR_TOKEN:-}
      DEVICE_KEY: ${DEVICE_KEY:-}
      INVITE_CODE: ${INVITE_CODE:-}
      DEVICE_DENY: ${DEVICE_DENY:-}
      ASR_URL: http://asr:8110
      MT_URL: http://llm:8000
      MT_MODEL: translator-mt
      TTS_URL: http://tts:8003
      TTS_MODE: direct
      VOICE_URL: ${VOICE_URL:-}
    mem_limit: 128m

  # Klonování hlasu. XTTS-v2 má nekomerční licenci CPML, souhlas s ní dává držitel
  # projektu nastavením COQUI_TOS_AGREED=1 v .env, nikdy výchozí hodnota.
  # Start: VOICE_URL=http://voice:8111 v .env, pak docker compose --profile clone up -d
  voice:
    build: ../../workers/voice
    container_name: translator-voice
    profiles: [clone]
    restart: unless-stopped
    environment:
      VOICE_ENGINE: ${VOICE_ENGINE:-xtts}
      COQUI_TOS_AGREED: ${COQUI_TOS_AGREED:-0}
      XTTS_MODEL: /models/xtts
      VOICES_DIR: /voices
    volumes:
      - /srv/work/translator-models/voice:/models
      - /srv/translator-voices:/voices   # mimo /srv/work: zálohu by smazání hlasu nezasáhlo
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  # Veřejný vstup. Jen odchozí spojení, takže přesun domény na jiný stroj = spustit
  # tento kontejner tam se stejným tokenem. Start: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:2026.7.3
    container_name: translator-tunnel
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://orchestrator:8096 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    mem_limit: 128m
