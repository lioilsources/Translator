# Orchestrátor na JODĚ. Hodnoty dodává .env (viz .env.example).
services:
  translator:
    build: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      # Tokeny zařízení (docs/protocol.md, „Zařízení“). TRANSLATOR_TOKEN je
      # starý sdílený token z buildů; po přechodu ho smaž.
      TRANSLATOR_TOKEN: ${TRANSLATOR_TOKEN:-}
      DEVICE_KEY: ${DEVICE_KEY:-}
      INVITE_CODE: ${INVITE_CODE:-}
      DEVICE_DENY: ${DEVICE_DENY:-}
      ASR_URL: ${ASR_URL:?}
      MT_URL: ${MT_URL:?}
      MT_API_KEY: ${MT_API_KEY:-}
      MT_MODEL: ${MT_MODEL:-bench-qwen36}
      TTS_URL: ${TTS_URL:?}
      TTS_API_KEY: ${TTS_API_KEY:-}
    mem_limit: 128m
